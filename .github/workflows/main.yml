name: Build Mega Drive Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: App version shown in Android
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: write

env:
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK_VERSION: "28.2.13676358"
  GRADLE_VERSION: "9.5.0"
  PROOT_SOURCE_REPOSITORY: "https://github.com/berilevi/proot-static.git"

jobs:
  build:
    name: Generate Linux runtime and Kotlin APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require public hosting for first-run Linux runtime
        shell: bash
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          if [[ "$REPOSITORY_PRIVATE" == "true" ]]; then
            echo "This build publishes the ARM64 Linux runtime as a public Release asset for first-run downloads." >&2
            echo "Make this repository public before building, or implement an authenticated runtime delivery service." >&2
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python for project generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install asset generator dependency
        run: python -m pip install --disable-pip-version-check --no-warn-script-location Pillow

      - name: Install Android command-line tools and SDK components
        shell: bash
        run: |
          set -euo pipefail

          # Use a clean, job-local SDK and install only currently published packages.
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          CMDLINE_TOOLS_BUILD="15859902" # Android command-line tools 22.0
          mkdir -p "$SDK_ROOT/cmdline-tools"

          curl --fail --location --retry 3 --retry-delay 2 \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_BUILD}_latest.zip" \
            --output "$RUNNER_TEMP/android-command-line-tools.zip"
          unzip -q "$RUNNER_TEMP/android-command-line-tools.zip" -d "$RUNNER_TEMP/android-command-line-tools"
          mv "$RUNNER_TEMP/android-command-line-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"

          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_HOME="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          # Accept only the licenses required by packages used in this build.
          # Feed answers non-interactively without installing the obsolete tools package.
          printf 'y\n%.0s' {1..100} | sdkmanager --sdk_root="$SDK_ROOT" --licenses >/dev/null

          sdkmanager --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Enable ARM64 emulation for Linux runtime image
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Unpack self-contained Android project generator
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/mega-drive-project"
