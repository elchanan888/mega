            grep -q 'postToOutput' app/src/main/java/com/example/megadrive/ApiClient.kt
            grep -q 'setSingleLine(true)' app/src/main/java/com/example/megadrive/MainActivity.kt
            grep -q 'PluginStore.installZip' app/src/main/java/com/example/megadrive/MainActivity.kt
            grep -q 'fetchJson' app/src/main/java/com/example/megadrive/PluginActivity.kt
            grep -q 'MegaDriveCommandRunner.spawn' app/src/main/assets/bridge.py
            grep -q 'AppTheme.Purple' app/src/main/res/values/styles.xml
            grep -q 'org.videolan.android:libvlc-all:3.7.7' app/build.gradle.kts
            grep -q 'class VlcPlayerActivity' app/src/main/java/com/example/megadrive/VlcPlayerActivity.kt
            python -c "import xml.etree.ElementTree as ET; from pathlib import Path; [ET.parse(p) for p in (Path('app/src/main/AndroidManifest.xml'), Path('app/src/main/res/values/styles.xml'))]"
          )
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Build Ubuntu ARM64 runtime root filesystem
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$PROJECT_DIR"
          RUNTIME_CONTEXT="$RUNNER_TEMP/mega-drive-runtime-image"
          mkdir -p "$RUNTIME_CONTEXT" "$PROJECT/dist"
          cp "$PROJECT/runtime-requirements.txt" "$RUNTIME_CONTEXT/requirements.txt"

          cat > "$RUNTIME_CONTEXT/Dockerfile" <<'DOCKERFILE'
          # Buildx selects linux/arm64 through --platform on the build command.
          # Do not hard-code FROM --platform; it is redundant and triggers a Docker warning.
          FROM ubuntu:26.10
          ENV DEBIAN_FRONTEND=noninteractive LANG=C.UTF-8 LC_ALL=C.UTF-8
          RUN set -eux; \
              if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then \
                sed -i '/^Components:/ { /universe/! s/$/ universe/; }' /etc/apt/sources.list.d/ubuntu.sources; \
              else \
                echo 'deb http://ports.ubuntu.com/ubuntu-ports stonking main universe' > /etc/apt/sources.list; \
              fi; \
              apt-get update; \
              apt-cache policy megacmd; \
              apt-get install -y --no-install-recommends \
                ca-certificates curl xz-utils tar procps \
                tor privoxy megacmd python3 python3-venv; \
              python3 -m venv /opt/venv; \
              /opt/venv/bin/pip install --no-cache-dir --upgrade pip; \
              rm -rf /var/lib/apt/lists/*
          COPY requirements.txt /tmp/app-requirements.txt
          RUN set -eux; \
              /opt/venv/bin/pip install --no-cache-dir \
                'fastapi>=0.115,<1' \
                'uvicorn>=0.30,<1' \
                'requests[socks]>=2.32,<3' \
                'stem>=1.8,<2' \
                'rich>=13,<15'; \
              if [ -s /tmp/app-requirements.txt ]; then \
                /opt/venv/bin/pip install --no-cache-dir -r /tmp/app-requirements.txt; \
              fi; \
              command -v mega-cmd-server; \
              command -v mega-login; \
              command -v mega-logout; \
              command -v mega-df; \
              command -v mega-proxy; \
              command -v mega-ls; \
              command -v mega-mkdir; \
              command -v mega-rm; \
              command -v mega-put; \
              command -v mega-get; \
              command -v mega-whoami; \
              command -v mega-mv; \
              command -v mega-thumbnail; \
              command -v mega-preview; \
              id debian-tor; \
              /opt/venv/bin/python -c 'import fastapi, uvicorn, requests, stem, rich'; \
              mkdir -p /var/lib/mega-drive /var/lib/tor /run/tor; \
              rm -rf /tmp/* /var/tmp/* /var/cache/apt/* /usr/share/doc/* /usr/share/man/* /usr/share/info/* /var/lib/apt/lists/*; \
              true
          DOCKERFILE

          echo "=== Disk space before ARM64 runtime build ==="
          df -h "$RUNNER_TEMP" "$PROJECT"
          docker system df || true

          docker buildx build \
            --platform linux/arm64 \
            --load \
            --tag mega-drive-linux-rootfs:ci \
            --cache-from type=gha,scope=mega-drive-rootfs-arm64 \
            --cache-to type=gha,mode=max,scope=mega-drive-rootfs-arm64 \
            "$RUNTIME_CONTEXT"

          echo "=== Disk space after ARM64 image build ==="
          df -h "$RUNNER_TEMP" "$PROJECT"
          CONTAINER_ID="$(docker create --platform linux/arm64 mega-drive-linux-rootfs:ci)"
          trap 'docker rm -f "$CONTAINER_ID" >/dev/null 2>&1 || true' EXIT

          RUNTIME_ARCHIVE="$PROJECT/dist/linux-rootfs-arm64.tar.gz"
          RUNTIME_FILE_LIST="$RUNNER_TEMP/linux-rootfs-arm64-files.txt"
          echo "Exporting ARM64 root filesystem..."
          docker export "$CONTAINER_ID" | gzip -1 > "$RUNTIME_ARCHIVE"
          test -s "$RUNTIME_ARCHIVE"
          gzip -t "$RUNTIME_ARCHIVE"

          # IMPORTANT: Never pipe tar -t into grep -q under pipefail.
          # grep -q closes the pipe as soon as it finds a match, which can make
          # tar fail with "tar: stdout: write error" even when the archive is valid.
          tar -tzf "$RUNTIME_ARCHIVE" > "$RUNTIME_FILE_LIST"
          for required_path in \
            'usr/bin/python3' \
            'usr/bin/mega-cmd-server' \
            'opt/venv/bin/uvicorn'; do
            if ! grep -Fxq -- "$required_path" "$RUNTIME_FILE_LIST"; then
              echo "ERROR: Linux runtime archive is missing: $required_path" >&2
              echo "First archive entries:" >&2
              sed -n '1,80p' "$RUNTIME_FILE_LIST" >&2
              exit 1
            fi
          done
          rm -f "$RUNTIME_FILE_LIST"
          sha256sum "$RUNTIME_ARCHIVE" > "$RUNTIME_ARCHIVE.sha256"
          RUNTIME_SHA256="$(cut -d ' ' -f1 "$PROJECT/dist/linux-rootfs-arm64.tar.gz.sha256")"
          RELEASE_TAG="android-runtime-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RUNTIME_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/linux-rootfs-arm64.tar.gz"
          {
            echo "RUNTIME_SHA256=$RUNTIME_SHA256"
            echo "RELEASE_TAG=$RELEASE_TAG"
            echo "RUNTIME_URL=$RUNTIME_URL"
          } >> "$GITHUB_ENV"
          echo "Built ARM64 runtime: $(du -h "$PROJECT/dist/linux-rootfs-arm64.tar.gz" | cut -f1)"

      - name: Build standalone Android PRoot executable
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/proot-static"
          BUILD_OUT="$RUNNER_TEMP/proot-build-aarch64"
          ARTIFACT_OUT="$RUNNER_TEMP/proot-dist/aarch64"

          git clone --depth 1 "$PROOT_SOURCE_REPOSITORY" "$SOURCE"
          chmod +x "$SOURCE/tools/build-static-aarch64.sh"
          mkdir -p "$BUILD_OUT" "$ARTIFACT_OUT"

          # Keep the compiler's private work directory separate from the
          # artifact directory. Do not derive REPO_ARTIFACT_DIR from OUT in
          # the same environment-assignment list: Bash can expand it using
          # the newly assigned OUT value, causing the following tests to
          # look in a different directory from the one the build populated.
          (
            cd "$SOURCE"
            env \
              NDK="$ANDROID_NDK_ROOT" \
              OUT="$BUILD_OUT" \
              REPO_ARTIFACT_DIR="$ARTIFACT_OUT" \
              ./tools/build-static-aarch64.sh
          )

          for artifact in proot loader loader32; do
            if [[ ! -s "$ARTIFACT_OUT/$artifact" ]]; then
              echo "ERROR: PRoot build did not create $ARTIFACT_OUT/$artifact" >&2
              echo "Build output directory contents:" >&2
              find "$BUILD_OUT" -maxdepth 4 -type f -printf '%p (%s bytes)\n' 2>/dev/null | sort >&2 || true
              echo "Artifact directory contents:" >&2
              find "$ARTIFACT_OUT" -maxdepth 2 -type f -printf '%p (%s bytes)\n' 2>/dev/null | sort >&2 || true
              exit 1
            fi
          done

          PROOT_FILE_INFO="$(file "$ARTIFACT_OUT/proot")"
          printf '%s\n' "$PROOT_FILE_INFO"
          if ! grep -Eqi 'ARM aarch64|AArch64' <<< "$PROOT_FILE_INFO"; then
            echo "ERROR: Expected an ARM64 PRoot binary, got: $PROOT_FILE_INFO" >&2
            exit 1
          fi

          JNILIBS="$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNILIBS" "$PROJECT_DIR/app/src/main/assets/THIRD_PARTY_LICENSES"
          install -m 0755 "$ARTIFACT_OUT/proot" "$JNILIBS/libproot.so"
          install -m 0755 "$ARTIFACT_OUT/loader" "$JNILIBS/libproot_loader.so"
          install -m 0755 "$ARTIFACT_OUT/loader32" "$JNILIBS/libproot_loader32.so"
          if [[ -f "$SOURCE/COPYING" ]]; then
            cp "$SOURCE/COPYING" "$PROJECT_DIR/app/src/main/assets/THIRD_PARTY_LICENSES/PROOT-COPYING"
          fi
          sha256sum "$JNILIBS"/* > "$PROJECT_DIR/dist/proot-binaries.sha256"

      - name: Inject runtime URL, version and build identity
        shell: bash
        env:
          APP_VERSION: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          python - "$PROJECT_DIR/app/build.gradle.kts" "$RUNTIME_URL" "$RUNTIME_SHA256" "$APP_VERSION" "$GITHUB_RUN_NUMBER" <<'PY'
          from pathlib import Path
          import re, sys
          gradle = Path(sys.argv[1])
          runtime_url, runtime_sha, version, version_code = sys.argv[2:]
          if not re.fullmatch(r'[0-9]+(?:\.[0-9]+){1,2}(?:[-+][A-Za-z0-9.-]+)?', version):
              raise SystemExit('Invalid version_name. Use a value such as 1.0.0')
          text = gradle.read_text(encoding='utf-8')
          text = text.replace('@@RUNTIME_URL@@', runtime_url).replace('@@RUNTIME_SHA256@@', runtime_sha)
          text = re.sub(r'versionCode = 1', f'versionCode = {int(version_code)}', text)
          text = text.replace('versionName = "1.0.0"', f'versionName = "{version}"')
          if '@@RUNTIME_' in text:
              raise SystemExit('A runtime BuildConfig placeholder was not replaced')
          gradle.write_text(text, encoding='utf-8')
          PY

      - name: Download Gradle and generate wrapper
        shell: bash
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/gradle-${GRADLE_VERSION}"
          curl --fail --location --retry 3 "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          cd "$PROJECT_DIR"
          "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin/gradle" --no-daemon wrapper --gradle-version "$GRADLE_VERSION"
          chmod +x ./gradlew

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace --max-workers=2 :app:assembleRelease
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          fi
          test -n "$APK" && test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/mega-drive-unsigned.apk

      - name: Sign APK for installation
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          DIST="$PROJECT_DIR/dist"
          KEYSTORE="$RUNNER_TEMP/mega-drive-signing.jks"
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            STORE_PASS="$ANDROID_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASS="$ANDROID_KEY_PASSWORD"
          elif [[ -z "$ANDROID_KEYSTORE_BASE64$ANDROID_KEYSTORE_PASSWORD$ANDROID_KEY_ALIAS$ANDROID_KEY_PASSWORD" ]]; then
            echo "No signing secrets configured; generating a temporary signing key for this build."
            STORE_PASS="$(openssl rand -hex 24)"
            KEY_PASS="$STORE_PASS"
            KEY_ALIAS="mega-drive"
            keytool -genkeypair -v -keystore "$KEYSTORE" -storetype JKS \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 3072 -validity 10000 \
              -dname "CN=Mega Drive Build, OU=Android, O=Local App, C=IL"
          else
            echo "ERROR: Configure all four ANDROID_KEYSTORE_* secrets, or leave all four empty." >&2
            exit 1
          fi
          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/zipalign"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/apksigner"
          "$ZIPALIGN" -f -p 4 "$DIST/mega-drive-unsigned.apk" "$DIST/mega-drive-aligned.apk"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" \
            --out "$DIST/mega-drive.apk" "$DIST/mega-drive-aligned.apk"
          "$APKSIGNER" verify --verbose "$DIST/mega-drive.apk"
          APK_ENTRIES="$RUNNER_TEMP/mega-drive-apk-entries.txt"
          unzip -Z1 "$DIST/mega-drive.apk" > "$APK_ENTRIES"
          for required_entry in \
            'lib/arm64-v8a/libproot.so' \
            'lib/arm64-v8a/libproot_loader.so'; do
            if ! grep -Fxq -- "$required_entry" "$APK_ENTRIES"; then
              echo "ERROR: APK is missing required native library: $required_entry" >&2
              exit 1
            fi
          done
          rm -f "$APK_ENTRIES"
          sha256sum "$DIST/mega-drive.apk" > "$DIST/mega-drive.apk.sha256"
          cat > "$DIST/build-manifest.json" <<EOF
          {
            "app": "Mega Drive",
            "version": "${{ inputs.version_name }}",
            "version_code": ${GITHUB_RUN_NUMBER},
            "runtime_architecture": "arm64",
            "runtime_url": "${RUNTIME_URL}",
            "runtime_sha256": "${RUNTIME_SHA256}",
            "release_tag": "${RELEASE_TAG}",
            "source_commit": "${GITHUB_SHA}",
            "signing_key_persisted": $([[ -n "$ANDROID_KEYSTORE_BASE64" ]] && echo true || echo false)
          }
          EOF

      - name: Publish APK and Linux runtime Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Mega Drive Android ${{ inputs.version_name }} (build ${{ github.run_number }})"
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            ${{ env.PROJECT_DIR }}/dist/mega-drive.apk
            ${{ env.PROJECT_DIR }}/dist/mega-drive.apk.sha256
            ${{ env.PROJECT_DIR }}/dist/build-manifest.json
            ${{ env.PROJECT_DIR }}/dist/linux-rootfs-arm64.tar.gz
            ${{ env.PROJECT_DIR }}/dist/linux-rootfs-arm64.tar.gz.sha256
            ${{ env.PROJECT_DIR }}/dist/proot-binaries.sha256
          body: |
            Generated Android APK and first-run Ubuntu ARM64 PRoot runtime.

            The Android app is Kotlin-native. Linux runtime is downloaded on first launch and verified with SHA-256.
            This release is a prerelease build; test on an ARM64 Android device before production use.

      - name: Upload APK and Runtime as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mega-drive-${{ inputs.version_name }}-build-${{ github.run_number }}
          path: |
            ${{ env.PROJECT_DIR }}/dist/mega-drive.apk
            ${{ env.PROJECT_DIR }}/dist/mega-drive.apk.sha256
            ${{ env.PROJECT_DIR }}/dist/build-manifest.json
            ${{ env.PROJECT_DIR }}/dist/linux-rootfs-arm64.tar.gz
            ${{ env.PROJECT_DIR }}/dist/linux-rootfs-arm64.tar.gz.sha256
            ${{ env.PROJECT_DIR }}/dist/proot-binaries.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
